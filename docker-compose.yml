services:
  postgres:
    image: postgres:16
    container_name: toons-postgres
    environment:
      POSTGRES_DB: toons
      POSTGRES_USER: toons_dev
      POSTGRES_PASSWORD: SOLO-DESARROLLO-CAMBIAR
    ports:
      - "5433:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data

volumes:
  datos-postgres:
